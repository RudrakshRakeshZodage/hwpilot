[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpilot"
version = "0.1.2"
description = "Hardware-aware ML environment setup and compatibility manager."
readme = "README.md"
authors = [
    { name = "Rudraksh Rakesh Zodage", email = "rudrakshrakeshzodage@gmail.com" }
]
maintainers = [
    { name = "Rudraksh Rakesh Zodage", email = "rudrakshrakeshzodage@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "hwpilot",
    "hardware-detection",
    "hardware-aware",
    "pytorch",
    "cuda",
    "gpu",
    "nvidia",
    "nvidia-driver",
    "machine-learning",
    "deep-learning",
    "environment-manager",
    "cuda-compatibility",
    "ai-infrastructure",
    "rudrakshrakeshzodage"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.8"
dependencies = [
    "rich>=12.0.0",
    "platformdirs>=2.5.0",
    "packaging>=21.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/RudrakshRakeshZodage/hwpilot"
Documentation = "https://github.com/RudrakshRakeshZodage/hwpilot#readme"
Repository = "https://github.com/RudrakshRakeshZodage/hwpilot.git"
Issues = "https://github.com/RudrakshRakeshZodage/hwpilot/issues"
LinkedIn = "https://www.linkedin.com/in/rudraksh-zodage-/"
HuggingFace = "https://huggingface.co/rudrakshrakeshzodage"

[project.scripts]
hwpilot = "hwpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
